<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1730">
<title>Ruta Caravanera</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed top-down road on canvas; HUD styled as Spanish blue road signs; menus as sign panels over the moving road */
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
:root{
  --sign:#1b4fa0;
  --sign-deep:#0e2c63;
  --paper:#f6f7f2;
  --ochre:#e8b63a;
  --alert:#e2483d;
  --camp:#6b4a2b;
  --ink:#0b1730;
  --muted:#b9c6e0;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--ink);color:var(--paper)}
body{font-family:var(--body);font-size:17px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
#road{position:absolute;inset:0;width:100%;height:100%;display:block}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:stretch;
  padding-top:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.sign{background:var(--sign);color:var(--paper);border-radius:7px;padding:5px 10px 6px;
  box-shadow:inset 0 0 0 2px var(--sign),inset 0 0 0 3.5px var(--paper),0 3px 0 rgba(0,0,0,.25);
  display:flex;flex-direction:column;justify-content:center;min-width:0}
#hud.camp .sign{background:var(--camp);box-shadow:inset 0 0 0 2px var(--camp),inset 0 0 0 3.5px var(--paper),0 3px 0 rgba(0,0,0,.25)}
#hud.camp .gauge{background:#4a321c}
.sign .lbl{font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.sign .val{font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.sign .sub{font-weight:500;font-size:13px;opacity:.9;font-variant-numeric:tabular-nums;white-space:nowrap}
#sKm{flex:0 0 auto}
#sFuel{flex:1 1 auto}
.gauge{height:10px;border-radius:5px;background:var(--sign-deep);box-shadow:inset 0 0 0 1.5px rgba(246,247,242,.6);overflow:hidden;margin:4px 0 3px}
.gauge i{display:block;height:100%;width:100%;background:var(--paper);transform-origin:left;transition:background .2s}
.gauge.low i{background:var(--alert)}
#sHits{flex:0 0 auto;align-items:center}
.dents{display:flex;gap:4px;margin-top:4px}
.dents b{width:11px;height:11px;border-radius:50%;background:var(--paper)}
.dents b.off{background:transparent;box-shadow:inset 0 0 0 2px var(--alert)}
#pause{pointer-events:auto;flex:0 0 auto;width:44px;border:0;cursor:pointer;font:700 15px var(--body);letter-spacing:.06em}
#pause:focus-visible,.pick:focus-visible,.btn:focus-visible,.lvl:focus-visible,#brake:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}

#gust{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:var(--ochre);color:var(--ink);
  font:700 16px var(--body);letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border-radius:6px;
  box-shadow:inset 0 0 0 2px var(--ochre),inset 0 0 0 3.5px var(--ink);white-space:nowrap;pointer-events:none}

/* Pedal de freno */
#brake{position:absolute;bottom:14px;left:max(16px,env(safe-area-inset-left,0px));width:84px;height:96px;border:0;cursor:pointer;
  border-radius:16px 16px 22px 22px;background:#2a2d31;color:var(--paper);touch-action:none;
  box-shadow:inset 0 0 0 3px #4a4e55,0 5px 0 #121417;font:700 15px var(--body);letter-spacing:.14em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .06s}
#brake i{display:block;width:52px;height:6px;border-radius:3px;background:#4a4e55;box-shadow:0 12px 0 #4a4e55,0 24px 0 #4a4e55;margin-bottom:22px}
#brake.on{transform:translateY(4px);box-shadow:inset 0 0 0 3px var(--alert),0 1px 0 #121417;color:#ffb3a8}
#brake.on i{background:var(--alert);box-shadow:0 12px 0 var(--alert),0 24px 0 var(--alert)}

/* Overlays */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  background:rgba(11,23,48,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{width:100%;max-width:440px;margin:auto;background:var(--sign);border-radius:14px;padding:18px 16px 16px;
  box-shadow:inset 0 0 0 3px var(--sign),inset 0 0 0 5.5px var(--paper),0 10px 30px rgba(0,0,0,.4);
  display:flex;flex-direction:column;gap:14px}
.panel.camp{background:var(--camp);box-shadow:inset 0 0 0 3px var(--camp),inset 0 0 0 5.5px var(--paper),0 10px 30px rgba(0,0,0,.4)}
.tag{display:inline-flex;align-self:flex-start;gap:8px;align-items:center;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.tag .road{background:var(--alert);color:var(--paper);padding:1px 7px;border-radius:4px;letter-spacing:.04em}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,11vw,48px);line-height:.95;margin:0;text-wrap:balance;letter-spacing:.01em}
h1 em{font-style:normal;color:var(--ochre)}
h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;margin:0;text-wrap:balance}
.lede{margin:0;font-size:18px;line-height:1.3;color:var(--paper)}
.sec{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 -6px}
.picks,.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick,.lvl{all:unset;box-sizing:border-box;cursor:pointer;border-radius:10px;padding:10px 9px;background:var(--sign-deep);
  display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:inset 0 0 0 2px rgba(246,247,242,.18);transition:box-shadow .15s,transform .15s}
.pick[aria-pressed="true"],.lvl[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ochre);transform:translateY(-2px)}
.pick canvas{width:100%;height:58px;display:block}
.pick .car,.lvl .nm{font-weight:700;font-size:17px;line-height:1.05}
.pick .van,.lvl .ds{font-weight:500;font-size:13.5px;line-height:1.15;color:var(--muted)}
.lvl .badge{align-self:flex-start;font-weight:700;font-size:12px;letter-spacing:.06em;padding:1px 7px;border-radius:4px}
.lvl[data-level="autovia"] .badge{background:var(--alert);color:var(--paper)}
.lvl[data-level="camping"] .badge{background:var(--camp);color:var(--paper);box-shadow:inset 0 0 0 1.5px var(--paper)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 7px;align-items:center;margin-top:2px}
.stats span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:rgba(246,247,242,.15);overflow:hidden}
.bar i{display:block;height:100%;background:var(--paper)}
.pick[aria-pressed="true"] .bar i{background:var(--ochre)}
.note{font-size:13px;line-height:1.2;color:var(--muted)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-family:var(--display);font-size:22px;padding:14px 16px;border-radius:10px;
  background:var(--ochre);color:var(--ink);box-shadow:0 4px 0 #9b7414;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9b7414}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px rgba(246,247,242,.6);font-size:17px;padding:11px}
.how{margin:0;font-size:15px;line-height:1.35;color:var(--muted)}
.how b{color:var(--paper);font-weight:600}
.best{margin:0;font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.results div{background:rgba(0,0,0,.22);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.results span{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.results b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.newrec{color:var(--ochre);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px;margin:0}
.row{display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:reduce){.pick,.btn,.gauge i,.lvl,#brake{transition:none}}
</style>

</head>
<body>
<div id="app">
  <canvas id="road" aria-label="Carretera del juego"></canvas>

  <div id="hud" hidden>
    <div class="sign" id="sKm"><span class="lbl" id="l1">Km</span><span class="val" id="km">0,0</span><span class="sub" id="tokens">0 fichas</span></div>
    <div class="sign" id="sFuel"><span class="lbl" id="l2">Gasoil</span><div class="gauge" id="gauge"><i id="fuelBar"></i></div><span class="sub" id="speed">80 km/h</span></div>
    <div class="sign" id="sHits"><span class="lbl">Golpes</span><div class="dents" id="dents"><b></b><b></b><b></b></div></div>
    <button class="sign" id="pause" aria-label="Pausa">II</button>
  </div>
  <div id="gust" hidden>Viento lateral</div>
  <button id="brake" hidden aria-label="Freno, mantener pulsado"><i></i>FRENO</button>

  <div class="overlay" id="menu">
    <div class="panel">
      <div class="tag"><span class="road">A-7</span> Dirección camping</div>
      <h1>Ruta<br><em>Caravanera</em></h1>
      <p class="sec">Pantalla</p>
      <div class="levels">
        <button class="lvl" data-level="autovia" aria-pressed="true">
          <span class="badge">A-7</span>
          <span class="nm">Autovía</span>
          <span class="ds">Tráfico, gasoil y rachas de viento. Llega lo más lejos posible.</span>
        </button>
        <button class="lvl" data-level="camping" aria-pressed="false">
          <span class="badge">Camping</span>
          <span class="nm">Hasta la parcela</span>
          <span class="ds">Bicis, niños, balones y badenes en el camino de grava.</span>
        </button>
      </div>
      <p class="sec">Conjunto</p>
      <div class="picks">
        <button class="pick" data-rig="c5" aria-pressed="true">
          <canvas data-preview="c5"></canvas>
          <span class="car">Citroën C5 · 2003</span>
          <span class="van">Gris plata + Knaus Sport 500 QDK · 2008</span>
          <span class="stats" data-stats="c5"></span>
          <span class="note">Suspensión hidroneumática: la caravana se calma antes.</span>
        </button>
        <button class="pick" data-rig="sharan" aria-pressed="false">
          <canvas data-preview="sharan"></canvas>
          <span class="car">VW Sharan · 2018</span>
          <span class="van">Blanca + Fendt Saphir 560 TFK · 2007</span>
          <span class="stats" data-stats="sharan"></span>
          <span class="note">Depósito grande, pero la Fendt pesa y culea más.</span>
        </button>
      </div>
      <button class="btn" id="go">Arrancar</button>
      <p class="how" id="howText"></p>
      <p class="best" id="bestMenu">Récord: 0 puntos</p>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel" id="overPanel">
      <div class="tag"><span class="road" id="overBadge">A-7</span> <span id="overTag">Fin del viaje</span></div>
      <h2 id="overTitle">¡Sin gasoil!</h2>
      <p class="lede" id="overText">Te has quedado en el arcén.</p>
      <div class="results">
        <div><span id="rL1">Km</span><b id="rKm">0</b></div>
        <div><span>Fichas</span><b id="rTok">0</b></div>
        <div><span>Puntos</span><b id="rPts">0</b></div>
      </div>
      <p class="newrec" id="newRec" hidden>Nuevo récord</p>
      <p class="best" id="bestOver">Récord: 0 puntos</p>
      <div class="row">
        <button class="btn" id="again">Otra vez</button>
        <button class="btn ghost" id="change">Cambiar pantalla o conjunto</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="paused" hidden>
    <div class="panel">
      <h2>Parada técnica</h2>
      <p class="lede">El juego está en pausa.</p>
      <div class="row">
        <button class="btn" id="resume">Seguir</button>
        <button class="btn ghost" id="quit">Volver al inicio</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[(Math.random()*arr.length)|0];
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, String(v)); } catch(e){} }
};

/* ---------- Conjuntos ---------- */
const RIGS = {
  c5: {
    carColor:'#b9bec5', type:'sedan', carL:4.62, carW:1.78, rs:.41, re:.73,
    vanL:5.0, vanW:2.25, scheme:{a:'#7d848c', b:'#c8323a'},
    agility:1.0, stability:.85, tank:.8,
    stats:{Manejo:.9, Estabilidad:.85, Depósito:.68}
  },
  sharan: {
    carColor:'#eef0ee', type:'mpv', carL:4.85, carW:1.9, rs:.33, re:.9,
    vanL:5.6, vanW:2.3, scheme:{a:'#ab8b57', b:'#5b4732'},
    agility:.84, stability:.62, tank:1.0,
    stats:{Manejo:.74, Estabilidad:.62, Depósito:.95}
  }
};
let rigId = store.get('rutacaravanera.rig', 'c5'); if (!RIGS[rigId]) rigId = 'c5';
let rig = RIGS[rigId];

/* ---------- Pantallas ---------- */
const LEVELS = {
  autovia: { lanes:3, scrollMul:1, best:'rutacaravanera.best',
    how:'<b>Arrastra el dedo</b> para cambiar de carril y <b>mantén FRENO</b> para dejar pasar el tráfico. Coge <b>bidones de gasoil</b> y <b>fichas de camping</b>. Las <b>rachas de viento</b> hacen culear la caravana.' },
  camping: { lanes:2, scrollMul:1.6, goal:600, best:'rutacaravanera.best.camping',
    how:'<b>Arrastra el dedo</b> para esquivar bicis, niños y coches mal aparcados. En los <b>badenes</b> y cuando cruce alguien, <b>mantén FRENO</b>. Llega a la <b>parcela</b> rápido y sin golpes.' }
};
let levelId = store.get('rutacaravanera.level', 'autovia'); if (!LEVELS[levelId]) levelId = 'autovia';
let L = LEVELS[levelId];
let lanes = L.lanes;
const isCamp = () => levelId === 'camping';

/* ---------- Canvas ---------- */
const cv = $('road'), ctx = cv.getContext('2d');
let W=0, H=0, DPR=1, u=28, roadL=0, roadR=0, laneW=0, carFrontY=200;
function resize(){
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const base = Math.min(W - 2*Math.max(30, W*.085), 480);
  u = Math.min(base/3/3.5, H/23);
  const roadW = isCamp() ? Math.min(7.6*u, W - 2*Math.max(30, W*.12)) : base;
  roadL = (W - roadW)/2; roadR = roadL + roadW;
  laneW = roadW / lanes;
  carFrontY = Math.max(118, H*.29);
  if (p) { p.x = clamp(p.x, minX(), maxX()); p.tx = clamp(p.tx, minX(), maxX()); }
  drawPreviews();
}
const laneX = i => roadL + laneW*(i+.5);
const minX = () => roadL + rig.vanW*u/2 + 3;
const maxX = () => roadR - rig.vanW*u/2 - 3;

/* ---------- Utilidades de dibujo ---------- */
function rr(c,x,y,w,h,r){
  r = Math.max(0, Math.min(r, w/2, h/2));
  c.beginPath(); c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=n>>16, g=(n>>8)&255, b=n&255;
  const t = amt<0 ? 0 : 255, k = Math.abs(amt);
  r = Math.round(r+(t-r)*k); g = Math.round(g+(t-g)*k); b = Math.round(b+(t-b)*k);
  return `rgb(${r},${g},${b})`;
}
// Coche visto desde arriba: frontal en y=0, trasera en y=l
function drawCar(c, w, l, color, o){
  const type = o.type || 'sedan', rs = o.rs || .4, re = o.re || .74;
  c.fillStyle = 'rgba(0,0,0,.28)'; rr(c,-w/2+w*.1, l*.04, w, l, w*.3); c.fill();
  c.fillStyle = shade(color,-.4);
  rr(c,-w/2-w*.11, l*.29, w*.16, l*.045, 2); c.fill();
  rr(c, w/2-w*.05, l*.29, w*.16, l*.045, 2); c.fill();
  const g = c.createLinearGradient(-w/2,0,w/2,0);
  g.addColorStop(0, shade(color,-.32)); g.addColorStop(.22, color);
  g.addColorStop(.55, shade(color,.2)); g.addColorStop(1, shade(color,-.32));
  c.fillStyle = g; rr(c,-w/2,0,w,l,w*.3); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.12)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(-w*.22,l*.05); c.lineTo(-w*.28,l*.25); c.moveTo(w*.22,l*.05); c.lineTo(w*.28,l*.25); c.stroke();
  c.fillStyle = o.brakeLights ? '#ffffff' : '#fff4c8';
  rr(c,-w*.43, l*.012, w*.25, l*.035, 3); c.fill();
  rr(c, w*.18, l*.012, w*.25, l*.035, 3); c.fill();
  c.fillStyle = '#1b2430';
  rr(c,-w*.43, l*rs, w*.86, l*(re-rs), w*.16); c.fill();
  const ws = rs - (type==='mpv' ? .1 : .13);
  c.beginPath();
  c.moveTo(-w*.42, l*ws); c.quadraticCurveTo(0, l*(ws-.03), w*.42, l*ws);
  c.lineTo(w*.37, l*rs+2); c.lineTo(-w*.37, l*rs+2); c.closePath(); c.fill();
  c.fillStyle = shade(color,.12);
  rr(c,-w*.36, l*rs, w*.72, l*(re-rs), w*.14); c.fill();
  if (type === 'mpv'){
    c.strokeStyle = shade(color,-.45); c.lineWidth = Math.max(1.5, w*.04);
    c.beginPath(); c.moveTo(-w*.3,l*(rs+.04)); c.lineTo(-w*.3,l*(re-.03));
    c.moveTo(w*.3,l*(rs+.04)); c.lineTo(w*.3,l*(re-.03)); c.stroke();
  }
  c.fillStyle = '#1b2430';
  const rw = type==='mpv' ? .05 : .09;
  c.beginPath(); c.moveTo(-w*.37,l*re-1); c.lineTo(w*.37,l*re-1); c.lineTo(w*.4,l*(re+rw)); c.lineTo(-w*.4,l*(re+rw)); c.closePath(); c.fill();
  c.fillStyle = '#c62f2a';
  rr(c,-w*.46, l*.96, w*.22, l*.03, 2); c.fill();
  rr(c, w*.24, l*.96, w*.22, l*.03, 2); c.fill();
}
// Caravana: enganche en (0,0), lanza hasta db, cuerpo de db a db+L
function drawCaravan(c, Wd, L, db, sc, braking){
  c.strokeStyle = '#2a2d31'; c.lineWidth = Math.max(2, Wd*.05); c.lineCap = 'round';
  c.beginPath(); c.moveTo(0,2); c.lineTo(-Wd*.28, db+2); c.moveTo(0,2); c.lineTo(Wd*.28, db+2); c.stroke();
  c.fillStyle = '#e7e7e1'; rr(c,-Wd*.2, db*.42, Wd*.4, db*.5, 3); c.fill();
  c.fillStyle = 'rgba(0,0,0,.28)'; rr(c,-Wd/2+Wd*.08, db+L*.03, Wd, L, Wd*.12); c.fill();
  c.fillStyle = '#f4f4f0'; rr(c,-Wd/2, db, Wd, L, Wd*.12); c.fill();
  c.fillStyle = sc.a;
  c.fillRect(-Wd/2, db+L*.2, Wd*.06, L*.68); c.fillRect(Wd/2-Wd*.06, db+L*.2, Wd*.06, L*.68);
  c.fillStyle = sc.b;
  c.fillRect(-Wd/2+Wd*.065, db+L*.32, Wd*.025, L*.44); c.fillRect(Wd/2-Wd*.09, db+L*.32, Wd*.025, L*.44);
  c.fillStyle = '#26323d'; rr(c,-Wd*.37, db+L*.012, Wd*.74, L*.045, 4); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.08)'; c.lineWidth = 1;
  c.beginPath();

/* ---------- Audio ---------- */
let actx = null;
function audioOn(){
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){ actx = null; }
}
function beep(f, d, type='square', vol=.06, slide=0){
  if (!actx) return;
  try {
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f+slide), t+d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.02);
  } catch(e){}
}

/* ---------- Autovía: tráfico ---------- */
const CAR_COLORS = ['#c0392b','#2d5d9f','#e9e7e0','#1f2024','#5f7a3a','#d98c2b','#6c6f76','#8a2f4f'];
const TRAFFIC_V = 46; // todo el tráfico va a la misma velocidad: los huecos no se cierran solos
const laneOf = x => clamp(Math.floor((x - roadL) / laneW), 0, lanes-1);
function laneBusy(lane, yTop, yBot){
  const cx = laneX(lane);
  for (const o of obs){ if (Math.abs(o.x-cx) < laneW*.6 && o.y < yBot && o.y+o.l > yTop) return true; }
  for (const it of items){ if (Math.abs(it.x-cx) < laneW*.6 && it.y < yBot && it.y > yTop) return true; }
  return false;
}
function freeLanes(yTop, yBot){ const r=[]; for (let i=0;i<lanes;i++) if (!laneBusy(i,yTop,yBot)) r.push(i); return r; }
function spawnTraffic(){
  const r = Math.random();
  let o;
  if (r < .5) o = {kind:'car', w:1.8*u, l:4.4*u, color:pick(CAR_COLORS), type: Math.random()<.3?'mpv':'sedan'};
  else if (r < .65) o = {kind:'car', w:2.0*u, l:5.3*u, color:'#ecedea', type:'mpv', rs:.25, re:.92};
  else if (r < .85) o = {kind:'truck', w:2.5*u, l:rnd(11,13)*u, color:pick(['#c0392b','#1b4fa0','#e8b63a','#2e7d4f','#e9e7e0'])};
  else o = {kind:'rig', w:2.25*u, l:(4.4+1.1+4.8)*u, color:pick(CAR_COLORS)};
  o.v = TRAFFIC_V; o.hit = false;
  const top = -o.l - 10, bot = -10;
  const gap = (rig.carL + 1.1 + rig.vanL + 10) * u;
  const maxLanes = km < 2.5 ? 1 : 2;
  const ok = [];
  for (let lane = 0; lane < lanes; lane++){
    if (laneBusy(lane, top - 4*u, bot + 4*u)) continue;
    const used = new Set([lane]);
    for (const q of obs){ if (q.y < bot + gap && q.y + q.l > top - gap) used.add(laneOf(q.x)); }
    if (used.size <= maxLanes) ok.push(lane);
  }
  if (!ok.length) return;
  const lane = pick(ok);
  o.x = laneX(lane) + rnd(-.05,.05)*laneW; o.y = top;
  obs.push(o);
}
function spawnItem(kind){
  const free = freeLanes(-8*u, 2*u);
  if (!free.length) return false;
  const lane = pick(free);
  if (kind === 'tok' && Math.random() < .45){
    for (let k=0;k<3;k++) items.push({kind, x:laneX(lane), y:-30 - k*2.2*u, t:Math.random()*6});
  } else items.push({kind, x:laneX(lane), y:-30, t:Math.random()*6});
  return true;
}

/* ---------- Camping: sucesos ---------- */
const SHIRTS = ['#e2483d','#1b4fa0','#e8b63a','#2e9a49','#d26fb0','#f6f7f2','#ff8a3d'];
const HAIRS = ['#3a2a1a','#6b4a2b','#c9a14a','#1d1d1d'];
function campEvent(){
  const r = Math.random();
  const prog = dist / L.goal;
  if (r < .2){ // bici de frente por el carril izquierdo
    obs.push({kind:'bike', x:laneX(0) + rnd(-.1,.1)*laneW, bx:0, y:-3*u, w:.55*u, l:1.9*u, vy:u*rnd(2.2,3.4), oncoming:true, col:pick(SHIRTS), t:0});
  } else if (r < .3){ // bici en tu sentido, más lenta
    obs.push({kind:'bike', x:laneX(lanes-1) + rnd(-.1,.1)*laneW, bx:0, y:-3*u, w:.55*u, l:1.9*u, vy:-u*rnd(.6,1.2), oncoming:false, col:pick(SHIRTS), t:0});
  } else if (r < .5){ // niño que cruza
    const fromLeft = Math.random() < .5;
    obs.push({kind:'kid', x: fromLeft ? roadL - 1.4*u : roadR + 1.4*u, y:-1.5*u, w:.8*u, l:.8*u, dir: fromLeft?1:-1, vx:u*rnd(3,3.8), trig:carFrontY - u*rnd(6,10), col:pick(SHIRTS), hair:pick(HAIRS), t:0});
  } else if (r < .62){ // balón y niño detrás
    const fromLeft = Math.random() < .5, trig = carFrontY - u*rnd(7,10);
    obs.push({kind:'ball', x: fromLeft ? roadL - 1*u : roadR + 1*u, y:-1.5*u, w:.6*u, l:.6*u, dir: fromLeft?1:-1, vx:u*6.5, trig, t:0});
    obs.push({kind:'kid', x: fromLeft ? roadL - 2.4*u : roadR + 2.4*u, y:-1.5*u, w:.8*u, l:.8*u, dir: fromLeft?1:-1, vx:u*3.6, trig, col:pick(SHIRTS), hair:pick(HAIRS), t:0});
  } else if (r < .8){ // badén
    obs.push({kind:'bump', x:(roadL+roadR)/2, y:-1*u, w:roadR-roadL, l:.7*u, done:false});
    deco.push({type:'bumpSign', x: roadR + Math.min(1.3*u, (W-roadR)*.5), y:-8*u});
  } else if (r < .92){ // coche mal aparcado
    const right = Math.random() < .6;
    const w = 1.8*u;
    obs.push({kind:'parked', x: right ? roadR - w*.3 : roadL + w*.3, y:-5*u, w, l:4.4*u, color:pick(CAR_COLORS), type:'sedan'});
  } else {
    const lane = (Math.random()*lanes)|0;
    for (let k=0;k<3;k++) items.push({kind:'tok', x:laneX(lane), y:-30 - k*2.2*u, t:Math.random()*6});
  }
  if (Math.random() < .35) { const lane = (Math.random()*lanes)|0; items.push({kind:'tok', x:laneX(lane), y:-14*u, t:0}); }
  nextEventM = dist + rnd(28, 46) - prog*10;
}

/* ---------- Decorado ---------- */
function spawnDeco(y0){
  const left = Math.random() < .5;
  const vergeW = left ? roadL : W - roadR;
  if (vergeW < u*1.3) return;
  const y = y0 === undefined ? -3*u : y0;
  if (isCamp()){
    const r = Math.random();
    const edge = 1.0*u;
    const x = left ? rnd(u*.5, roadL - edge - u*.6) : rnd(roadR + edge + u*.6, W - u*.5);
    if (r < .45) deco.push({type:'pine', x, y, s:rnd(.9,1.4)*u});
    else if (r < .8) deco.push({type:'tent', x, y, s:rnd(1.6,2.2)*u, col:pick(['#e8b63a','#2e7d4f','#1b4fa0','#e2483d','#8a5fb0'])});
    else deco.push({type:'van', x: left ? roadL - edge - 1.3*u : roadR + edge + 1.3*u, y, sc:{a:pick(['#7d848c','#ab8b57','#3a6ea5']), b:'#5b4732'}});
  } else {
    const s = rnd(.7,1.2)*u;
    const x = left ? rnd(-s, roadL - u*.9 - s*.6) : rnd(roadR + u*.9 + s*.6, W + s);
    deco.push({type:'olive', x, y, s});
  }
}

/* ---------- Física del jugador ---------- */
function stepPlayer(dt, v){
  const prevVx = p.vx;
  const vRef = Math.max(v, u*14);
  const maxV = u*(isCamp() ? 7.5 : 9.5)*rig.agility;
  const desired = clamp((p.tx - p.x)*6, -maxV, maxV);
  p.vx += (desired - p.vx) * Math.min(1, dt*7*rig.agility);
  let push = 0;
  if (gust.phase === 'blow') push = gust.dir * u * 2.6 * (1.25 - rig.stability*.4);
  p.x = clamp(p.x + (p.vx + push)*dt, minX(), maxX());
  p.head = Math.atan2(p.vx + push*.4, vRef);
  const Lt = (1.1 + rig.vanL*.55) * u;
  p.th += (vRef/Lt) * Math.sin(p.head - p.th) * dt;
  const ax = (p.vx - prevVx) / Math.max(dt, .001);
  const K = 22, C = .8 + rig.stability*3;
  let F = -(ax/u) * .05 * (1.3 - rig.stability);
  if (gust.phase === 'blow') F += gust.dir * 3.2 * (1.3 - rig.stability);
  p.swayV += (-K*p.sway - C*p.swayV + F) * dt;
  p.sway = clamp(p.sway + p.swayV*dt, -.45, .45);
  // al frenar, el conjunto se queda un poco atrás en pantalla
  const backTarget = (state === 'play' && braking) ? 2.4*u : 0;
  p.back += (backTarget - p.back) * Math.min(1, dt*(braking ? 2.5 : 1.6));
}
function trailerAngle(){ return p.th + p.sway; }
function playerBoxes(){
  const cl = rig.carL*u, cw = rig.carW*u, db = 1.1*u, vl = rig.vanL*u, vw = rig.vanW*u;
  const fy = frontY(), hy = fy + cl, a = trailerAngle();
  const d = db + vl/2;
  const cx = p.x - Math.sin(a)*d, cy = hy + Math.cos(a)*d;
  return [
    {x:p.x - cw*.45, y:fy + cl*.03, w:cw*.9, h:cl*.94},
    {x:cx - vw*.45, y:cy - vl*.46, w:vw*.9, h:vl*.92}
  ];
}
const overlap = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

/* ---------- Bucle ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (state !== 'paused') update(dt);
  render();
  requestAnimationFrame(frame);
}
function approach(target, up, down, dt){ speed += clamp(target - speed, -down*dt, up*dt); }
function registerHit(text, pushDir){
  hits++; invuln = 1.6; shake = .45; penalty = isCamp() ? 8 : 18;
  p.swayV += pushDir * 2.5;
  pops.push({x:p.x, y:frontY() - 10, text, c:'#ff8a7a', t:0});
  sfx.hit(); renderDents();
  if (navigator.vibrate) try { navigator.vibrate(120); } catch(e){}
}
function update(dt){
  time += dt;
  const playing = state === 'play';
  const camp = isCamp();
  // velocidad
  if (state === 'menu'){
    approach(camp ? 20 : 72, 30, 30, dt);
    p.tx = (roadL+roadR)/2 + Math.sin(time*.55)*(roadR-roadL)*.3;
  } else if (playing){
    penalty = Math.max(0, penalty - dt*(camp ? 4 : 10));
    if (camp) approach(braking ? 4 : 21 - penalty, 7, 26, dt);
    else approach(braking ? 38 : 72 + Math.min(38, km*1.6) - penalty, 18, 55, dt);
  } else {
    approach(0, 0, camp ? 25 : 60, dt);
  }
  const f = u*.85/3.6;
  const v = speed * f * L.scrollMul;
  dashOff = (dashOff + v*dt) % (12*u);
  fieldOff = (fieldOff + v*dt) % (camp ? 9*u : 3*u);
  railOff = (railOff + v*dt) % (2*u);

  stepPlayer(dt, v);

  // decorado
  decoAcc += v*dt;
  const step = camp ? 1.8*u : 2.2*u;
  while (decoAcc > step){ decoAcc -= step; if (Math.random() < (camp ? .7 : .55)) spawnDeco(); }
  for (const d of deco) d.y += v*dt;
  deco = deco.filter(d => d.y < H + 4*u);
  for (const k of posts) k.y += v*dt;
  posts = posts.filter(k => k.y < H + 2*u);

  if (playing && !camp){
    const dk = speed*dt/3600*6.5;
    km += dk;
    fuel -= dk * 8.2 / rig.tank;
    if (Math.floor(km) > lastKmInt){ lastKmInt = Math.floor(km); posts.push({n: lastKmInt + 1, y: -2*u}); }
    graceT -= dt; spawnT -= dt;
    if (spawnT <= 0 && graceT <= 0){
      spawnTraffic();
      if (km > 3 && Math.random() < Math.min(.35, km*.02)) spawnTraffic();
      spawnT = clamp(1.3 - km*.025, .6, 1.3) * rnd(.8,1.2);
    }
    if (km >= nextFuelKm){ if (spawnItem('fuel')) nextFuelKm = km + rnd(.9,1.35); }
    if (km >= nextTokKm){ if (spawnItem('tok')) nextTokKm = km + rnd(.22,.45); }
    gust.t -= dt;
    if (gust.phase === 'idle' && gust.t <= 0 && km > .6){
      gust.phase = 'warn'; gust.t = 1.1; gust.dir = Math.random() < .5 ? -1 : 1;
      const g = $('gust'); g.textContent = gust.dir > 0 ? 'Viento lateral  →' : '←  Viento lateral'; g.hidden = false;
    } else if (gust.phase === 'warn' && gust.t <= 0){
      gust.phase = 'blow'; gust.t = rnd(1.4,2.2); sfx.gust();
    } else if (gust.phase === 'blow' && gust.t <= 0){
      gust.phase = 'idle'; gust.t = rnd(6,11) - Math.min(3, km*.1); $('gust').hidden = true;
    }
  }
  if (playing && camp){
    runT += dt;
    dist += speed/3.6 * dt * 1.6;
    if (dist >= nextEventM && dist < L.goal - 60) campEvent();
    if (!finishShown && dist >= L.goal - 45){
      finishShown = true;
      deco.push({type:'parcel', x: roadR + Math.min(1.6*u, (W-roadR)*.55), y:-3*u, n: parcelNo});
    }
    if (dist >= L.goal) return winCamp();
  }
  if (gust.phase === 'blow' && Math.random() < dt*30){
    streaks.push({x: gust.dir>0 ? -40 : W+40, y: rnd(0,H), len: rnd(30,90), vx: gust.dir*rnd(700,1100)});
  }
  for (const s of streaks) s.x += s.vx*dt;
  streaks = streaks.filter(s => s.x > -120 && s.x < W+120);

  // obstáculos
  for (const o of obs){
    if (o.kind === 'car' || o.kind === 'truck' || o.kind === 'rig'){ o.y += (speed - o.v) * f * dt; continue; }
    o.y += v*dt + (o.vy || 0)*dt;
    o.t = (o.t || 0) + dt;
    if (o.kind === 'bike'){ o.bx = Math.sin(o.t*2.2)*u*.18; }
    if ((o.kind === 'kid' || o.kind === 'ball') && o.y > o.trig){
      o.x += o.dir * o.vx * dt;
      if (o.kind === 'kid' && !o.bell && o.y > -u && o.y < H*.25){ o.bell = true; }
    }
  }
  obs = obs.filter(o => o.y < H + 3*u && o.y > -60*u && o.x > -8*u && o.x < W + 8*u);
  for (const it of items){ it.y += v*dt; it.t += dt; }
  items = items.filter(it => it.y < H + 2*u && !it.got);

  invuln = Math.max(0, invuln - dt);
  shake = Math.max(0, shake - dt);

  if (playing){
    const boxes = playerBoxes();
    for (const it of items){
      const s = (it.kind === 'fuel' ? 1.2 : 1.4)*u;
      const ib = {x: it.x - s/2, y: it.y - s/2, w: s, h: s};
      if (boxes.some(b => overlap(b, ib))){
        it.got = true;
        if (it.kind === 'fuel'){ fuel = Math.min(100, fuel + 32); pops.push({x:it.x, y:it.y, text:'+ GASOIL', c:'#7fe39a', t:0}); sfx.fuel(); }
        else { tokens++; pops.push({x:it.x, y:it.y, text:'+25', c:'#f6f7f2', t:0}); sfx.token(); }
      }
    }
    // badenes: se juzgan al pasar el morro
    for (const o of obs){
      if (o.kind !== 'bump' || o.done) continue;
      if (o.y + o.l > frontY() + rig.carL*u*.15){
        o.done = true;
        if (speed > 11 && invuln <= 0){ registerHit('¡Badén a tope!', Math.random()<.5?-1:1); p.swayV += 3; }
        else { pops.push({x:p.x, y:frontY() - 10, text:'Despacito', c:'#bff0c8', t:0}); sfx.bump(); }
      }
    }
    if (invuln <= 0){
      for (const o of obs){
        if (o.hit || o.kind === 'bump') continue;
        let ob;
        if (o.kind === 'kid' || o.kind === 'ball') ob = {x:o.x - o.w/2, y:o.y - o.l/2, w:o.w, h:o.l};
        else if (o.kind === 'bike') ob = {x:o.x + (o.bx||0) - o.w/2, y:o.y - o.l/2, w:o.w, h:o.l};
        else ob = {x:o.x - o.w*.46, y:o.y + o.l*.02, w:o.w*.92, h:o.l*.96};
        const which = boxes.findIndex(b => overlap(b, ob));
        if (which < 0) continue;
        o.hit = true;
        const dir = o.x < p.x ? 1 : -1;
        let msg = which ? '¡Caravana!' : '¡Golpe!';
        if (o.kind === 'kid'){ msg = '¡Cuidado con el crío!'; o.dir = -dir; o.vx = u*6; o.trig = -1e9; }
        else if (o.kind === 'ball'){ msg = '¡El balón!'; o.dir = -dir; o.vx = u*8; }
        else if (o.kind === 'bike'){ msg = '¡Ring ring!'; o.x -= dir*laneW*.4; sfx.bell(); }
        else if (o.kind !== 'parked'){ o.x -= dir * laneW*.15; }
        registerHit(msg, dir);
        break;
      }
    }
    if (hits >= 3) return gameOver('hits');
    if (!camp && fuel <= 0){ fuel = 0; return gameOver('fuel'); }
    updateHud();
  }
  for (const pp of pops) { pp.t += dt; pp.y -= 40*dt; }
  pops = pops.filter(pp => pp.t < 1.1);
}

function renderGround(){
  if (isCamp()){
    ctx.fillStyle = '#7da34c'; ctx.fillRect(-20,-20,W+40,H+40);
    // parcelas: setos perpendiculares a ambos lados
    ctx.fillStyle = '#4f7a33';
    for (let y = -9*u + fieldOff; y < H + 9*u; y += 9*u){
      ctx.fillRect(-20, y, roadL - u*.4 + 20, u*.55);
      ctx.fillRect(roadR + u*.4, y, W - roadR + 20, u*.55);
    }
    // camino de grava
    ctx.fillStyle = '#cdb98f'; ctx.fillRect(roadL - u*.35, -20, (roadR-roadL) + u*.7, H+40);
    ctx.fillStyle = 'rgba(120,95,55,.18)';
    for (let i=0;i<lanes;i++){
      const cx = laneX(i);
      ctx.fillRect(cx - u*.95, -20, u*.4, H+40); ctx.fillRect(cx + u*.55, -20, u*.4, H+40);
    }
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    for (let y = -3*u + (dashOff % (3*u)); y < H; y += 3*u){
      ctx.fillRect(roadL + u*.6, y, 3, 3); ctx.fillRect(roadL + (roadR-roadL)*.47, y + u*1.3, 3, 3); ctx.fillRect(roadR - u*.9, y + u*.7, 3, 3);
    }
    // bordillos de seto
    ctx.fillStyle = '#3f6a2a';
    ctx.fillRect(roadL - u*.75, -20, u*.4, H+40); ctx.fillRect(roadR + u*.35, -20, u*.4, H+40);
    return;
  }
  ctx.fillStyle = '#c99f45'; ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle = 'rgba(120,85,25,.13)';
  for (let y = -3*u + fieldOff; y < H + 3*u; y += 3*u) ctx.fillRect(-20, y, W+40, u*1.2);
  ctx.fillStyle = '#8e8a80'; ctx.fillRect(roadL - u*.7, -20, (roadR-roadL) + u*1.4, H+40);
  ctx.fillStyle = '#34373c'; ctx.fillRect(roadL - u*.5, -20, (roadR-roadL) + u, H+40);
  ctx.fillStyle = 'rgba(255,255,255,.025)';
  for (let i=0;i<lanes;i++) ctx.fillRect(laneX(i) - laneW*.18, -20, laneW*.36, H+40);
  ctx.fillStyle = '#eceee8';
  const lw = Math.max(2, u*.14);
  ctx.fillRect(roadL - lw/2, -20, lw, H+40); ctx.fillRect(roadR - lw/2, -20, lw, H+40);
  for (let i=1;i<lanes;i++){
    const x = roadL + laneW*i - lw/2;
    for (let y = -12*u + dashOff; y < H; y += 12*u) ctx.fillRect(x, y, lw, 4.5*u);
  }
  ctx.fillStyle = '#b9bcbf';
  ctx.fillRect(roadL - u*.85, -20, 3, H+40); ctx.fillRect(roadR + u*.85 - 3, -20, 3, H+40);
  ctx.fillStyle = '#6d7075';
  for (let y = -2*u + railOff; y < H; y += 2*u){ ctx.fillRect(roadL - u*.9, y, 5, 5); ctx.fillRect(roadR + u*.9 - 5, y, 5, 5); }
  for (const k of posts) if (W - roadR > u*1.5) drawKmPost(ctx, roadR + u*1.6, k.y, k.n);
}
function render(){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  if (shake > 0 && !reduceMotion) ctx.translate(rnd(-1,1)*shake*14, rnd(-1,1)*shake*10);
  renderGround();
  // decorado bajo (caravanas aparcadas y tiendas)
  for (const d of deco){
    if (d.type === 'van'){ ctx.save(); ctx.translate(d.x, d.y); drawCaravan(ctx, 2.25*u, 5*u, 1.1*u, d.sc, false); ctx.restore(); }
    else if (d.type === 'tent') drawTent(ctx, d.x, d.y, d.s, d.col);
  }
  for (const o of obs) if (o.kind === 'bump') drawBump(ctx, roadL - u*.35, o.y, (roadR-roadL) + u*.7, o.l);
  for (const it of items){
    if (it.kind === 'fuel') drawFuel(ctx, it.x, it.y, 1.15*u);
    else drawToken(ctx, it.x, it.y, .62*u, it.t);
  }
  for (const o of obs){
    if (o.kind === 'bump') continue;
    if (o.kind === 'kid'){ drawKid(ctx, o.x, o.y, o.w, o.col, o.hair, o.y > o.trig ? o.t : 0, o.dir); continue; }
    if (o.kind === 'ball'){ drawBall(ctx, o.x, o.y, o.w/2, o.y > o.trig ? o.t*o.dir : 0); continue; }
    if (o.kind === 'bike'){ drawBike(ctx, o.x + o.bx, o.y, o.l, o.col, o.oncoming); continue; }
    ctx.save(); ctx.translate(o.x, o.y);
    if (o.kind === 'truck') drawTruck(ctx, o.w, o.l, o.color);
    else if (o.kind === 'rig'){
      const cl = 4.4*u;
      ctx.save(); ctx.translate(0, cl); drawCaravan(ctx, o.w, 4.8*u, 1.1*u, {a:'#8a8f96', b:'#2d5d9f'}, false); ctx.restore();
      drawCar(ctx, 1.8*u, cl, o.color, {type:'sedan'});
    } else drawCar(ctx, o.w, o.l, o.color, {type:o.type, rs:o.rs, re:o.re});
    ctx.restore();
  }
  // jugador
  const blink = invuln > 0 && Math.floor(invuln*10) % 2 === 0;
  ctx.globalAlpha = blink ? .45 : 1;
  const cl = rig.carL*u, hy = frontY() + cl;
  const brakeOn = braking && state === 'play';
  ctx.save(); ctx.translate(p.x, hy); ctx.rotate(trailerAngle()); drawCaravan(ctx, rig.vanW*u, rig.vanL*u, 1.1*u, rig.scheme, brakeOn); ctx.restore();
  ctx.save(); ctx.translate(p.x, hy); ctx.rotate(p.head); ctx.translate(0, -cl); drawCar(ctx, rig.carW*u, cl, rig.carColor, rig); ctx.restore();
  ctx.globalAlpha = 1;
  // decorado alto
  for (const d of deco){
    if (d.type === 'olive') drawOlive(ctx, d.x, d.y, d.s);
    else if (d.type === 'pine') drawPine(ctx, d.x, d.y, d.s);
    else if (d.type === 'bumpSign') drawBumpSign(ctx, d.x, d.y);
    else if (d.type === 'parcel') drawParcelSign(ctx, d.x, d.y, d.n);
  }
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const s of streaks){ ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - Math.sign(s.vx)*s.len, s.y); }
  ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `700 ${Math.round(u*.85)}px 'Barlow Condensed', sans-serif`;
  for (const pp of pops){
    ctx.globalAlpha = Math.max(0, 1 - pp.t);
    ctx.fillStyle = 'rgba(11,23,48,.7)'; ctx.fillText(pp.text, pp.x+1.5, pp.y+1.5);
    ctx.fillStyle = pp.c; ctx.fillText(pp.text, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------- HUD ---------- */
const fmtKm = n => n.toFixed(1).replace('.', ',');
const fmtTime = s => { const m = Math.floor(s/60), r = Math.floor(s%60); return m + ':' + String(r).padStart(2,'0'); };
function setupHud(){
  const camp = isCamp();
  $('hud').classList.toggle('camp', camp);
  $('l1').textContent = camp ? 'Parcela' : 'Km';
  $('l2').textContent = camp ? 'Recorrido' : 'Gasoil';
}
function updateHud(){
  const fichas = tokens === 1 ? '1 ficha' : tokens + ' fichas';
  if (isCamp()){
    $('km').textContent = parcelNo;
    $('tokens').textContent = 'Faltan ' + Math.max(0, Math.ceil(L.goal - dist)) + ' m';
    $('fuelBar').style.transform = `scaleX(${clamp(dist/L.goal,0,1)})`;
    $('gauge').classList.remove('low');
    $('speed').textContent = Math.round(speed) + ' km/h · ' + fmtTime(runT);
  } else {
    $('km').textContent = fmtKm(km);
    $('tokens').textContent = fichas;
    $('fuelBar').style.transform = `scaleX(${clamp(fuel/100,0,1)})`;
    $('gauge').classList.toggle('low', fuel < 25);
    $('speed').textContent = Math.round(speed) + ' km/h';
  }
}
function renderDents(){
  [...$('dents').children].forEach((b,i) => b.classList.toggle('off', i < hits));
}
const getBest = () => parseInt(store.get(L.best, '0'), 10) || 0;
function setBest(){ const t = 'Récord en ' + (isCamp() ? 'el camping' : 'la autovía') + ': ' + getBest().toLocaleString('es-ES') + ' puntos'; $('bestMenu').textContent = t; $('bestOver').textContent = t; }

/* ---------- Estados ---------- */
function showPlayUi(on){
  $('hud').hidden = !on; $('brake').hidden = !on;
  if (!on){ braking = false; $('brake').classList.remove('on'); }
}
function startGame(){
  audioOn();
  resetRun();
  state = 'play';
  $('menu').hidden = true; $('over').hidden = true; $('paused').hidden = true;
  setupHud(); showPlayUi(true);
  updateHud();
}
function endScreen(opts){
  state = opts.state;
  $('gust').hidden = true; gust.phase = 'idle';
  braking = false; $('brake').classList.remove('on');
  const s = Math.max(0, opts.points), rec = s > getBest();
  if (rec) store.set(L.best, s);
  setBest();
  $('overPanel').classList.toggle('camp', isCamp());
  $('overBadge').textContent = isCamp() ? 'Camping' : 'A-7';
  $('overTag').textContent = opts.tag;
  $('overTitle').textContent = opts.title;
  $('overText').textContent = opts.text;
  $('rL1').textContent = opts.l1; $('rKm').textContent = opts.v1;
  $('rTok').textContent = tokens; $('rPts').textContent = s.toLocaleString('es-ES');
  $('newRec').hidden = !rec;
  setTimeout(() => { showPlayUi(false); $('over').hidden = false; $('again').focus({preventScroll:true}); }, 800);
}
function gameOver(reason){
  sfx.over();
  if (isCamp()){
    endScreen({state:'over', tag:'Viaje interrumpido', title:'Te para el guarda', text:'Tres sustos en el camping son demasiados. Toca ir a recepción a dar explicaciones.',
      l1:'Recorrido', v1: Math.floor(dist) + ' m', points: tokens*25});
  } else if (reason === 'fuel'){
    endScreen({state:'over', tag:'Fin del viaje', title:'¡Sin gasoil!', text:'Te has quedado en el arcén con la caravana a cuestas.',
      l1:'Km', v1: fmtKm(km), points: Math.floor(km*100) + tokens*25});
  } else {
    endScreen({state:'over', tag:'Fin del viaje', title:'Llamando a la grúa', text:'Tres golpes son demasiados. El seguro se encarga del resto.',
      l1:'Km', v1: fmtKm(km), points: Math.floor(km*100) + tokens*25});
  }
}
function winCamp(){
  sfx.win();
  const pts = 500 + Math.max(0, Math.round((100 - runT)*10)) + tokens*25 - hits*150;
  const titles = ['¡Aparcado y sin un rasguño!', '¡En tu parcela!', '¡Llegaste, por los pelos!'];
  endScreen({state:'win', tag:'Llegada', title: titles[Math.min(2, hits)],
    text: `Parcela ${parcelNo} en ${fmtTime(runT)}` + (hits ? ` con ${hits} ${hits === 1 ? 'susto' : 'sustos'}.` : '. Ya puedes sacar el toldo.'),
    l1:'Tiempo', v1: fmtTime(runT), points: pts});
}
function toMenu(){
  state = 'menu';
  obs = []; items = []; pops = []; streaks = []; invuln = 0; gust.phase='idle';
  showPlayUi(false);
  $('over').hidden = true; $('paused').hidden = true; $('gust').hidden = true; $('menu').hidden = false;
}
function pauseGame(){ if (state !== 'play') return; state = 'paused'; braking = false; $('brake').classList.remove('on'); $('paused').hidden = false; }
function resumeGame(){ if (state !== 'paused') return; state = 'play'; $('paused').hidden = true; last = performance.now(); }

/* ---------- Selección ---------- */
function drawPreviews(){
  document.querySelectorAll('canvas[data-preview]').forEach(c => {
    const r = RIGS[c.dataset.preview];
    const w = c.clientWidth, h = c.clientHeight; if (!w || !h) return;
    const d = Math.min(window.devicePixelRatio || 1, 3);
    c.width = Math.round(w*d); c.height = Math.round(h*d);
    const x = c.getContext('2d'); x.setTransform(d,0,0,d,0,0); x.clearRect(0,0,w,h);
    x.fillStyle = '#34373c'; x.fillRect(0, h*.12, w, h*.76);
    x.fillStyle = 'rgba(236,238,232,.8)'; for (let i=4;i<w;i+=22) x.fillRect(i, h*.12, 10, 2), x.fillRect(i+8, h*.88-2, 10, 2);
    const total = r.carL + 1.1 + r.vanL;
    const su = Math.min((w-14)/total, (h*.7)/r.vanW);
    const saved = u; u = su;
    const hx = 7 + r.vanL*su + 1.1*su;
    x.save(); x.translate(hx, h/2); x.rotate(Math.PI/2);
    x.save(); drawCaravan(x, r.vanW*su, r.vanL*su, 1.1*su, r.scheme, false); x.restore();
    x.save(); x.translate(0, -r.carL*su); drawCar(x, r.carW*su, r.carL*su, r.carColor, r); x.restore();
    x.restore();
    u = saved;
  });
}
function renderStats(){
  document.querySelectorAll('[data-stats]').forEach(el => {
    const s = RIGS[el.dataset.stats].stats;
    el.innerHTML = Object.entries(s).map(([k,v]) => `<span>${k}</span><span class="bar"><i style="width:${Math.round(v*100)}%"></i></span>`).join('');
  });
}
function selectRig(id){
  rigId = id; rig = RIGS[id];
  store.set('rutacaravanera.rig', id);
  document.querySelectorAll('.pick').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.rig === id)));
  if (p){ p.sway = 0; p.swayV = 0; p.x = clamp(p.x, minX(), maxX()); }
}
function selectLevel(id){
  levelId = id; L = LEVELS[id]; lanes = L.lanes;
  store.set('rutacaravanera.level', id);
  document.querySelectorAll('.lvl').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.level === id)));
  $('howText').innerHTML = L.how;
  obs = []; items = []; posts = []; deco = [];
  resize();
  if (p){ p.x = p.tx = (roadL+roadR)/2; p.th = 0; p.sway = 0; }
  for (let i=0;i<16;i++) spawnDeco(rnd(-2*u, H));
  setBest();
}

/* ---------- Entrada ---------- */
const app = $('app');
function setTarget(e){
  if (state !== 'play') return;
  const r = cv.getBoundingClientRect();
  p.tx = clamp(e.clientX - r.left, minX(), maxX());
}
app.addEventListener('pointerdown', e => { if (e.target === cv) setTarget(e); }, {passive:true});
app.addEventListener('pointermove', e => { if (e.target === cv && (e.pointerType !== 'mouse' || e.buttons)) setTarget(e); }, {passive:true});
document.addEventListener('touchmove', e => { if (state === 'play') e.preventDefault(); }, {passive:false});
const brakeBtn = $('brake');
const setBrake = on => { braking = on && state === 'play'; brakeBtn.classList.toggle('on', braking); };
brakeBtn.addEventListener('pointerdown', e => { e.preventDefault(); try { brakeBtn.setPointerCapture(e.pointerId); } catch(_){} setBrake(true); });
['pointerup','pointercancel','lostpointercapture'].forEach(ev => brakeBtn.addEventListener(ev, () => setBrake(false)));
brakeBtn.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (state === 'play'){
    if (e.key === 'ArrowLeft' || e.key === 'a') p.tx = clamp(p.tx - laneW, minX(), maxX());
    if (e.key === 'ArrowRight' || e.key === 'd') p.tx = clamp(p.tx + laneW, minX(), maxX());
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === ' '){ e.preventDefault(); setBrake(true); }
    if (e.key === 'p' || e.key === 'Escape') pauseGame();
  } else if (state === 'paused' && (e.key === 'p' || e.key === 'Escape')) resumeGame();
});
window.addEventListener('keyup', e => { if (e.key === 'ArrowDown' || e.key === 's' || e.key === ' ') setBrake(false); });
document.querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => selectRig(b.dataset.rig)));
document.querySelectorAll('.lvl').forEach(b => b.addEventListener('click', () => selectLevel(b.dataset.level)));
$('go').addEventListener('click', startGame);
$('again').addEventListener('click', startGame);
$('change').addEventListener('click', toMenu);
$('pause').addEventListener('click', pauseGame);
$('resume').addEventListener('click', resumeGame);
$('quit').addEventListener('click', toMenu);
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('resize', resize);

/* ---------- Arranque ---------- */
renderStats();
resize();
p = newPlayer();
selectRig(rigId);
selectLevel(levelId);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawPreviews);
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
